<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPARROWANIME</title>
    <script src="https://kit.fontawesome.com/6ae23c62b1.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <div class="logo">
                <h1><i class="fa-solid fa-crow"></i> SPARROWANIME</h1>
            </div>
            <div class="tabs">
                <button id="homebutton" class="tab-btn active">Home</button>
                <button id="favourite" class="tab-btn">Favourite</button>
                <button id="recentlyviewed" class="tab-btn">Recently Viewed</button>
            </div>
            <div class="search">
                <input type="text" id="searchinput" placeholder="Search Anime">
                <button id="searchbtn"><i class="fa-solid fa-search"></i></button>
            </div>
            <select id="genres">
                <option value="">Choose a Genre</option>
                <option value="1">Action</option>
                <option value="2">Adventure</option>
                <option value="3">Comedy</option>
                <option value="4">Romance</option>
                <option value="5">Drama</option>
            </select>
        </header>
        <div class="vide">
            <video autoplay muted loop>
                <source src="anime.mp4" type="video/mp4">
            </video>
            <div id="results" class="results-container"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
