<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPARROWANIME</title>
    <script src="https://kit.fontawesome.com/6ae23c62b1.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <h1><i class="fa-solid fa-crow"></i> SPARROWANIME</h1>
            </div>
            <div class="tabs">
                <button class="tab-btn active">Home</button>
                <button class="tab-btn">Favourite</button>
                <button class="tab-btn">Recently Viewed</button>
            </div>
            <div class="search">
                <input type="text" placeholder="Search Anime">
                <button><i class="fa-solid fa-search"></i></button>
            </div>
            <select id="">
                <option value="">All Genres</option>
                <option value="1">Action</option>
                <option value="2">Adventure</option>
                <option value="3">Comedy</option>
                <option value="4">Romance</option>
                <option value="5">Drama</option>
            </select>
        </header>
    </div>
    <script src="script.js"></script>
</body>
</html>
